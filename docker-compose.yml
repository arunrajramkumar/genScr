services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: genscr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genscr}
      POSTGRES_DB: genscr
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genscr -d genscr"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://genscr:${POSTGRES_PASSWORD:-genscr}@db:5432/genscr
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: python -m app.ingest.scheduler
    environment:
      DATABASE_URL: postgresql://genscr:${POSTGRES_PASSWORD:-genscr}@db:5432/genscr
    depends_on:
      db:
        condition: service_healthy

  web: # static export served by nginx
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
