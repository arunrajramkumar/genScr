# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Render will prompt for values marked `sync: false`.
#
# FREE-TIER SETUP for trying things out:
#   - free web services sleep after ~15 min idle (first request then takes ~50s)
#   - free Postgres is time-limited by Render; upgrade before it expires
#   - cron jobs aren't available on free plans; the GitHub Actions "Data update" workflow
#     (.github/workflows/daily-update.yml) does the daily/weekly/monthly refresh instead
#
# To go production: change `plan: free` to `starter` (services) / `basic-256mb` (database),
# and uncomment the cron jobs at the bottom.
databases:
  - name: genscr-db
    databaseName: genscr
    user: genscr
    region: singapore
    plan: free

services:
  - type: web
    name: genscr-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: genscr-db, property: connectionString }
      - key: CORS_ORIGINS # e.g. https://genscr-web.onrender.com (later https://dalallens.in,https://www.dalallens.in)
        sync: false

  - type: web
    name: genscr-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    buildFilter:
      paths: ["web/**"]
    envVars:
      - key: NEXT_PUBLIC_API_URL # e.g. https://genscr-api.onrender.com (baked in at build time; redeploy after changing)
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: genScr
      - key: NEXT_PUBLIC_CONTACT_EMAIL # shown on Privacy/Terms as the grievance contact
        sync: false

