# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Render will prompt for values marked `sync: false`.
#
# FREE-TIER SETUP for trying things out:
#   - the website is a free static site (CDN, never sleeps); the free API sleeps after ~15 min idle
#     (first request then takes ~50s) - an uptime monitor pinging /api/health keeps it warm
#   - free Postgres is time-limited by Render; upgrade before it expires
#   - cron jobs aren't available on free plans; the GitHub Actions "Data update" workflow
#     (.github/workflows/daily-update.yml) does the daily/weekly/monthly refresh instead
#
# To go production: change `plan: free` to `starter` (services) / `basic-256mb` (database),
# and uncomment the cron jobs at the bottom.
databases:
  - name: genscr-db
    databaseName: genscr
    user: genscr
    region: singapore
    plan: free

services:
  - type: web
    name: genscr-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths: ["backend/**"]
    envVars:
      # Set by hand to the Neon connection string (Neon direct URL, read-only role recommended; see docs/ROADMAP.md).
      # Not linked to the Render database, so a Blueprint sync can't switch the API back to it.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS # e.g. https://genscr-site.onrender.com (later your domain)
        sync: false

  # Static site: served from Render's global CDN, free, never sleeps, no instance hours.
  - type: web
    name: genscr-site
    runtime: static
    buildCommand: cd web && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./web/out
    buildFilter:
      paths: ["web/**"]
    routes:
      - type: rewrite # one prebuilt shell serves every /stock/<SYMBOL>
        source: /stock/*
        destination: /stock/_/index.html
      - type: rewrite # real page, listed before the catch-all below
        source: /indices/compare/*
        destination: /indices/compare/index.html
      - type: rewrite # one prebuilt shell serves every /indices/<slug>
        source: /indices/*
        destination: /indices/_/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Only our own files and our API may load. Blocks injected third-party scripts and framing.
      # Next's static export needs inline bootstrap scripts, hence 'unsafe-inline'.
      # If the API moves (custom domain), update connect-src too.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://genscr-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: STATIC_EXPORT
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL # e.g. https://genscr-api.onrender.com (baked in at build time; redeploy after changing)
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: genScr
      - key: NEXT_PUBLIC_CONTACT_EMAIL # shown on Privacy/Terms as the grievance contact
        sync: false

  # --- Paid plans only: uncomment when upgrading -------------------------------
